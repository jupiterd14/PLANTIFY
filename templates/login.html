<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Planify</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #b47c9e20, #edd9e680);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 32px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        .logo {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            color: #b47c9e;
            margin-bottom: 30px;
        }
        h2 { text-align: center; margin-bottom: 24px; color: #2c2b2a; }
        .form-group { margin-bottom: 20px; position: relative; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #6b625c; }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #ede6e0;
            border-radius: 16px;
            font-size: 1rem;
            transition: all 0.2s;
        }
        input:focus { outline: none; border-color: #b47c9e; box-shadow: 0 0 0 3px rgba(180,124,158,0.1); }
        
        /* Password field with eye button */
        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 48px;
        }
        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 0;
            width: auto;
            color: #a39a93;
            transition: color 0.2s;
            font-weight: 500;
        }
        .toggle-password:hover {
            background: none;
            transform: translateY(-50%);
            color: #b47c9e;
        }
        
        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: #b47c9e;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        button[type="submit"]:hover { background: #8e5e7c; transform: translateY(-1px); }
        
        .flash-messages {
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 12px;
        }
        .links { text-align: center; margin-top: 20px; }
        .links a { color: #b47c9e; text-decoration: none; }
        .checkbox { display: flex; align-items: center; gap: 8px; }
        .checkbox input { width: auto; }
        .checkbox label { margin-bottom: 0; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">Planify</div>
        <h2>Welcome Back</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-messages" style="background: {% if category == 'danger' %}#f8d7da{% elif category == 'success' %}#d4edda{% else %}#d1ecf1{% endif %}; color: {% if category == 'danger' %}#721c24{% elif category == 'success' %}#155724{% else %}#0c5460{% endif %};">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required placeholder="Enter your username">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" name="password" id="password" required placeholder="Enter your password">
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        Show
                    </button>
                </div>
            </div>
            
            <div class="form-group checkbox">
                <input type="checkbox" name="remember" id="remember">
                <label for="remember">Remember me</label>
            </div>
            
            <button type="submit">Log In</button>
        </form>
        
        <div class="links">
            <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Sign up</a></p>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordField = document.getElementById('password');
            const toggleBtn = document.querySelector('.toggle-password');
            
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                toggleBtn.textContent = 'Hide';
            } else {
                passwordField.type = 'password';
                toggleBtn.textContent = 'Show';
            }
        }
    </script>
</body>
</html>
